name: Build Kernel P355

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-18.1

      - name: Clone AOSP arm toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain

      - name: Build kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          export HOSTCFLAGS="-fcommon"
          mkdir -p out
          make O=out \
            VARIANT_DEFCONFIG=msm8916_sec_gt58ltebmc_eur_defconfig \
            SELINUX_DEFCONFIG=selinux_defconfig \
            SELINUX_LOG_DEFCONFIG= \
            DEBUG_DEFCONFIG= \
            TIMA_DEFCONFIG= \
            DMVERITY_DEFCONFIG= \
            msm8916_sec_defconfig
          make O=out HOSTCFLAGS="-fcommon" -j$(nproc)

      - name: Clone dtbToolCM
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_device_qcom_common.git device-qcom-common
          cd device-qcom-common/dtbtoolCM
          gcc -o dtbToolCM dtbToolCM.c -Ilibufdt -lz 2>/dev/null || \
          gcc -o dtbToolCM *.c -I. -lz

      - name: Build dt.img
        run: |
          ./device-qcom-common/dtbtoolCM/dtbToolCM -2 -o dt.img -s 2048 out/arch/arm/boot/dts/

      - name: Debug - list boot output
        run: |
          ls -la out/arch/arm/boot/
          ls -la dt.img

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-output
          path: |
            out/arch/arm/boot/*
            dt.img
